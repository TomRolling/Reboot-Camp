# À chaque « push » sur la branche main : tests, fabrication du .exe, puis création d'une Release.
# L'appli regarde la dernière Release au lancement : c'est ce qui fait apparaître « Version … disponible ».
#
# Le numéro de version est 1.2.N, où N est le numéro de l'exécution (il augmente tout seul à chaque fois).
# La base est 1.2 parce que la dernière version publiée à la main était la 1.1.1 : un numéro plus petit ne serait
# jamais proposé aux applis déjà installées. Pour passer en 1.3 ou 2.0, changer « VERSION_DE_BASE » ci-dessous
# (toujours vers un numéro plus grand).
name: Publication

on:
  push:
    branches: [main]
    # Une modification du README ou de la documentation ne change pas l'appli : pas de nouvelle version.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer la Release

concurrency:
  group: publication
  cancel-in-progress: false

env:
  VERSION_DE_BASE: '1.2'

jobs:
  publier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Numéro de version
        shell: pwsh
        run: echo "VERSION=$env:VERSION_DE_BASE.${{ github.run_number }}" >> $env:GITHUB_ENV

      # Si un test échoue, rien n'est publié.
      - name: Tests
        run: dotnet test RebootCamp.Tests/RebootCamp.Tests.csproj -c Release -p:Version=${{ env.VERSION }}

      - name: Fabrication du .exe autonome
        run: >
          dotnet publish RebootCamp/RebootCamp.csproj -c Release -r win-x64
          -p:PublishSingleFile=true --self-contained true
          -p:Version=${{ env.VERSION }} -o sortie

      # Le fichier joint doit s'appeler RebootCamp.exe : c'est le nom visé par le lien de téléchargement du README,
      # et l'appli prend le .exe joint à la dernière Release pour se mettre à jour.
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$env:VERSION" sortie/RebootCamp.exe --title "Version $env:VERSION" --generate-notes
